[mutmut]
source_paths=
    scripts/
only_mutate=
    scripts/extracao_pje/segmentar_documentos.py
    scripts/extracao_pje/validar_integridade.py
    scripts/planejamento_pericial/validar_plano.py
    scripts/planejamento_pericial/gerar_processo.py
    scripts/conhecimento_privado/pesquisa_online.py
    scripts/redacao_pericial/autocorrigir_redacao.py
also_copy=
    config/
    schemas/
    evals/
pytest_add_cli_args_test_selection=
    tests/test_final_delta_r3.py
    tests/test_integridade_rastreabilidade_25.py
    tests/test_claude_terminal_continuation.py
    tests/test_core_properties.py
    tests/test_core_properties_v2.py
    tests/test_redacao_pericial.py
    tests/test_pesquisa_online.py
use_setproctitle=false
mutate_only_covered_lines=true
