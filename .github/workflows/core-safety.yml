name: core-safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core-safety:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          fetch-depth: 0
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: candidate/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r candidate/requirements-dev.txt
      - name: Architecture trust-boundary suite
        working-directory: candidate
        run: python -m pytest -q tests/test_architecture_analyzer_v1.py
      - name: Timing attribution policy suite
        working-directory: candidate
        run: python -m pytest -q tests/test_quality_gate_timing.py
      - name: Verify frozen Core V1 with paired timing attribution
        # --ignore only prunes directory-walk collection; it cannot silently
        # zero out the explicit-path "Architecture trust-boundary suite" step
        # above the way a -k/-m/--deselect filter would if this env block
        # were ever hoisted to job/workflow level. Keep it step-scoped and
        # keep using --ignore specifically (see the guard test in
        # tests/test_repository_safety_gate.py).
        env:
          PYTEST_ADDOPTS: "--ignore=tests/test_architecture_analyzer_v1.py --ignore=tests/test_quality_gate_timing.py"
          TIMING_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TIMING_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/candidate/.github/scripts/run-paired-core-safety.ps1" `
            -BaseRoot "$env:GITHUB_WORKSPACE/base" `
            -HeadRoot "$env:GITHUB_WORKSPACE/candidate" `
            -BaseSha "$env:TIMING_BASE_SHA" `
            -HeadSha "$env:TIMING_HEAD_SHA" `
            -EvidencePath "$env:RUNNER_TEMP/core-safety-timing-evidence.json"
