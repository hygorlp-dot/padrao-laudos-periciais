name: core-safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core-safety:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          cache-dependency-glob: uv.lock
      - name: Install test dependencies
        run: uv sync --locked --no-install-project
      - name: Architecture trust-boundary suite
        run: uv run --no-sync python -m pytest -q tests/test_architecture_analyzer_v1.py
      - name: Verify frozen Core V1
        # --ignore only prunes directory-walk collection; it cannot silently
        # zero out the explicit-path "Architecture trust-boundary suite" step
        # above the way a -k/-m/--deselect filter would if this env block
        # were ever hoisted to job/workflow level. Keep it step-scoped and
        # keep using --ignore specifically (see the guard test in
        # tests/test_repository_safety_gate.py).
        env:
          PYTEST_ADDOPTS: "--ignore=tests/test_architecture_analyzer_v1.py"
        run: uv run --no-sync python -m scripts.quality.verify_core --full
