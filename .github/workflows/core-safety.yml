name: core-safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core-safety:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Architecture trust-boundary suite
        run: python -m pytest -q tests/test_architecture_analyzer_v1.py
      - name: Private case storage suite
        run: python -m pytest -q tests/test_private_case_storage_v1.py
      - name: Verify frozen Core V1
        # --ignore only prunes directory-walk collection; it cannot silently
        # zero out either explicit-path blocking suite above the way a
        # -k/-m/--deselect filter would if this env block
        # were ever hoisted to job/workflow level. Keep it step-scoped and
        # keep using --ignore specifically (see the guard test in
        # tests/test_repository_safety_gate.py).
        env:
          PYTEST_ADDOPTS: "--ignore=tests/test_architecture_analyzer_v1.py --ignore=tests/test_private_case_storage_v1.py"
        run: python -m scripts.quality.verify_core --full
