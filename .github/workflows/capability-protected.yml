name: capability-protected

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  capability-protected:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout protected base verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false
      - name: Checkout exact candidate tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          cache-dependency-glob: trusted/uv.lock
      - name: Install trusted capability dependencies
        working-directory: trusted
        run: |
          uv lock --check
          $syncArgs = @("pip", "sync", "--system", "--require-hashes", "requirements-dev.txt")
          uv @syncArgs
      - name: Select capability judge from protected base
        working-directory: trusted
        shell: pwsh
        env:
          CAPABILITY_PROTECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $state = python -c "import os,sys; from pathlib import Path; from scripts.quality.capability_trust_anchor import _protected_base_bootstrap_present; state=_protected_base_bootstrap_present(Path.cwd(), os.environ['CAPABILITY_PROTECTED_BASE_SHA']); sys.exit(1) if state is None else print('true' if state else 'false')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CAPABILITY_BASE_BOOTSTRAP_PRESENT=$state" >> $env:GITHUB_ENV
      - name: Validate base-owned capability custody
        if: env.CAPABILITY_BASE_BOOTSTRAP_PRESENT != 'true'
        working-directory: trusted
        env:
          CAPABILITY_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          CAPABILITY_PROTECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CAPABILITY_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python -c "import os,sys; from pathlib import Path; from scripts.quality.capability_trust_anchor import validate_inert_trust_anchor; findings=validate_inert_trust_anchor(Path(os.environ['CAPABILITY_CANDIDATE_ROOT']), os.environ['CAPABILITY_PROTECTED_BASE_SHA'], os.environ['CAPABILITY_EXPECTED_HEAD_SHA']); print(findings); sys.exit(1 if findings else 0)"
      - name: Validate dedicated Word trust transition
        if: env.CAPABILITY_BASE_BOOTSTRAP_PRESENT == 'true'
        working-directory: trusted
        shell: pwsh
        env:
          CAPABILITY_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          CAPABILITY_PROTECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CAPABILITY_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $candidate = $env:CAPABILITY_EXPECTED_HEAD_SHA
          $base = $env:CAPABILITY_PROTECTED_BASE_SHA
          $transitionText = git show "${candidate}:config/capability-protected-transition-v1.json" 2>$null
          if ($LASTEXITCODE -ne 0) { exit 0 }
          try { $transition = $transitionText | ConvertFrom-Json -ErrorAction Stop } catch { exit 0 }
          if ($transition.transitionId -ne 'LOCAL_WORD_COM_CONTAINMENT_TRUST_TRANSITION_V1') { exit 0 }
          if ($transition.schemaVersion -ne '3.0.0' -or $transition.purpose -ne 'BOUND_MICROSOFT_WORD_COM_EXECUTION_FOR_AUTHORITATIVE_WORD_TO_PDF' -or $transition.scope -ne 'LOCAL_WORD_COM_CONTAINMENT_V1') {
            throw 'invalid dedicated Word trust transition contract'
          }
          $allowed = @(
            '.github/workflows/capability-protected.yml',
            'config/architecture-protected-transition-v1.json',
            'config/capability-protected-artifacts-v1.json',
            'config/capability-protected-transition-v1.json',
            'scripts/quality/architecture_analyzer.py',
            'scripts/quality/capability_trust_anchor.py',
            'tests/test_architecture_analyzer_v1.py',
            'tests/test_architecture_capability_exception_rebind_v1.py',
            'tests/test_architecture_capability_trust_anchor_v1.py'
          )
          $changed = @(git diff --name-only $base $candidate)
          if ($changed.Count -eq 0 -or (($changed | Where-Object { $allowed -notcontains $_ }).Count -ne 0)) {
            throw 'dedicated Word transition changed an out-of-scope path'
          }
          if ((($changed | Where-Object { $_ -eq 'scripts/quality/capability_trust_anchor.py' }).Count -eq 0) -and (($changed | Where-Object { $_ -eq 'scripts/quality/architecture_analyzer.py' }).Count -eq 0)) {
            throw 'dedicated Word transition did not change a protected trust judge'
          }
          $comparison = @'
          import json, os, subprocess
          from datetime import date
          from pathlib import Path
          from scripts.quality.capability_analyzer import analyze_capabilities
          from scripts.quality.capability_gate_adapter import apply_exact_exceptions

          root = Path(os.environ['CAPABILITY_CANDIDATE_ROOT'])
          base = os.environ['CAPABILITY_PROTECTED_BASE_SHA']
          candidate = os.environ['CAPABILITY_EXPECTED_HEAD_SHA']
          policy = Path(os.environ['GITHUB_WORKSPACE']) / 'trusted/config/capability-policy-v1.json'
          allowed_protected = {
              '.github/workflows/capability-protected.yml',
              'config/capability-protected-artifacts-v1.json',
              'scripts/quality/architecture_analyzer.py',
              'scripts/quality/capability_trust_anchor.py',
          }
          allowed_paths = {
              '.github/workflows/capability-protected.yml',
              'config/architecture-protected-transition-v1.json',
              'config/capability-protected-artifacts-v1.json',
              'config/capability-protected-transition-v1.json',
              'scripts/quality/architecture_analyzer.py',
              'scripts/quality/capability_trust_anchor.py',
              'tests/test_architecture_analyzer_v1.py',
              'tests/test_architecture_capability_exception_rebind_v1.py',
              'tests/test_architecture_capability_trust_anchor_v1.py',
          }
          transition_path = 'config/capability-protected-transition-v1.json'
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', base, candidate], cwd=root, text=True).splitlines())
          def identity(commit, path):
              output = subprocess.check_output(['git', 'ls-tree', commit, '--', path], cwd=root, text=True).strip()
              metadata, listed = output.split('\t', 1)
              mode, object_type, blob = metadata.split()
              if listed != path or object_type != 'blob':
                  raise ValueError('identity path/type mismatch')
              return {'path': path, 'state': 'PRESENT', 'mode': mode, 'objectType': object_type, 'blobSha': blob}
          transition = json.loads(subprocess.check_output(['git', 'show', f'{candidate}:{transition_path}'], cwd=root, text=True))
          transition_ok = (
              set(transition) == {'schemaVersion', 'transitionId', 'purpose', 'scope', 'protectedBaseSha', 'protectedArtifacts', 'supportArtifacts'}
              and
              transition.get('schemaVersion') == '3.0.0'
              and transition.get('transitionId') == 'LOCAL_WORD_COM_CONTAINMENT_TRUST_TRANSITION_V1'
              and transition.get('purpose') == 'BOUND_MICROSOFT_WORD_COM_EXECUTION_FOR_AUTHORITATIVE_WORD_TO_PDF'
              and transition.get('scope') == 'LOCAL_WORD_COM_CONTAINMENT_V1'
              and transition.get('protectedBaseSha') == base
              and isinstance(transition.get('protectedArtifacts'), list)
              and isinstance(transition.get('supportArtifacts'), list)
          )
          rows = {row.get('path'): row for row in transition.get('protectedArtifacts', []) if isinstance(row, dict)}
          supports = {row.get('path'): row for row in transition.get('supportArtifacts', []) if isinstance(row, dict)}
          changed_protected = changed & allowed_protected
          changed_support = changed - changed_protected - {transition_path, 'config/architecture-protected-transition-v1.json'}
          row_ok = len(rows) == len(transition.get('protectedArtifacts', [])) and len(supports) == len(transition.get('supportArtifacts', [])) and set(rows) == changed_protected and set(supports) == changed_support
          for path in changed_protected:
              row = rows.get(path, {})
              row_ok = row_ok and set(row) == {'path', 'base', 'candidate'} and row['base'] == identity(base, path) and row['candidate'] == identity(candidate, path)
          for path in changed_support:
              row = supports.get(path, {})
              row_ok = row_ok and set(row) == {'path', 'base', 'candidate'} and row['base'] == identity(base, path) and row['candidate'] == identity(candidate, path)
          # The registry remains base-owned: its path set and every identity must advance exactly.
          from scripts.quality.capability_trust_anchor import _load_registry
          base_registry = _load_registry(root, base)
          candidate_registry = _load_registry(root, candidate)
          registry_ok = base_registry is not None and candidate_registry is not None and [row['path'] for row in base_registry] == [row['path'] for row in candidate_registry]
          registry_ok = registry_ok and candidate_registry == [identity(candidate, row['path']) for row in base_registry]
          key = lambda item: (item.get('code'), item.get('canonicalPath'), item.get('module'), item.get('location', {}).get('line'), item.get('location', {}).get('column'), item.get('normalizedAstSha256'), item.get('policyVersion'), item.get('analyzer'))
          tree = lambda commit: subprocess.check_output(['git', 'rev-parse', f'{commit}^{{tree}}'], cwd=root, text=True).strip()
          left = sorted(key(item) for item in analyze_capabilities(root, base, tree(base), policy_path=policy))
          right = sorted(key(item) for item in analyze_capabilities(root, candidate, tree(candidate), policy_path=policy))
          base_findings = analyze_capabilities(root, base, tree(base), policy_path=policy)
          exceptions_ok = not apply_exact_exceptions(root, base_findings, base, base, registry_path='config/capability-exceptions-v1.json', schema_path=Path(os.environ['GITHUB_WORKSPACE']) / 'trusted/schemas/capability-exception-v1.schema.json', now=date.today())
          result = {'equal': left == right, 'baseCount': len(left), 'candidateCount': len(right), 'transition': transition_ok, 'rows': row_ok, 'registry': registry_ok, 'exceptions': exceptions_ok, 'paths': changed <= allowed_paths}
          print(json.dumps(result))
          if not all(result[key] for key in ('equal', 'transition', 'rows', 'registry', 'exceptions', 'paths')):
              raise SystemExit(1)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'protected capability comparison failed' }
          $result = $comparison | ConvertFrom-Json
          if (-not $result.equal) { throw "dedicated Word transition introduced new capability findings ($($result.baseCount) -> $($result.candidateCount))" }
          "CAPABILITY_TRUST_TRANSITION_APPROVED=true" >> $env:GITHUB_ENV
      - name: Enforce with base-owned capability judge
        if: env.CAPABILITY_BASE_BOOTSTRAP_PRESENT == 'true' && env.CAPABILITY_TRUST_TRANSITION_APPROVED != 'true'
        working-directory: trusted
        env:
          CAPABILITY_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          CAPABILITY_PROTECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CAPABILITY_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m scripts.quality.capability_bootstrap
