name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          cache-dependency-glob: uv.lock
      - name: Install Ruff
        run: |
          uv lock --check
          uv pip sync --system --require-hashes requirements-dev.txt
      - name: Ruff check (informational — not a required status check yet)
        run: python -m ruff check .
      - name: Gitleaks current tree and reachable history (advisory)
        continue-on-error: true
        shell: pwsh
        run: ./scripts/quality/run_gitleaks.ps1 -Advisory
