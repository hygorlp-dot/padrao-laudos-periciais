name: quality-depth

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  mutation-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run first-party deep quality boundary
        run: python -m scripts.quality.deep_quality
