name: Correção de defeito
description: Relate um comportamento que não funciona como esperado.
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: context
    attributes: {label: Contexto, description: "Onde e quando o problema ocorre?"}
    validations: {required: true}
  - type: textarea
    id: problem
    attributes: {label: Problema, description: Descreva o comportamento observado.}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Resultado esperado}
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes: {label: Critérios de aceite}
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes: {label: Evidências, description: Use somente material não privado.}
  - type: textarea
    id: privacy
    attributes: {label: Privacidade e segurança}
  - type: textarea
    id: tests
    attributes: {label: Testes necessários}
  - type: dropdown
    id: deploy
    attributes:
      label: Impacto em deploy
      options: [NONE, PREVIEW, BUILD, RELEASE, A DEFINIR]
    validations: {required: true}
