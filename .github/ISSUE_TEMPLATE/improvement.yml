name: Melhoria
description: Proponha uma melhoria incremental no produto ou processo.
title: "[Melhoria] "
labels: ["type:improvement"]
body:
  - type: textarea
    id: context
    attributes: {label: Contexto}
    validations: {required: true}
  - type: textarea
    id: need
    attributes: {label: Problema ou necessidade}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Resultado esperado}
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes: {label: Critérios de aceite}
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes: {label: Evidências, description: Não inclua processos ou dados pessoais reais.}
  - type: textarea
    id: privacy
    attributes: {label: Privacidade e segurança}
  - type: textarea
    id: tests
    attributes: {label: Testes necessários}
  - type: dropdown
    id: deploy
    attributes:
      label: Impacto em deploy
      options: [NONE, PREVIEW, BUILD, RELEASE, A DEFINIR]
    validations: {required: true}
